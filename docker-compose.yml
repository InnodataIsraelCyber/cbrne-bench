version: '3.8'

services:
  stage1-preparation:
    build:
      context: ./task_runs/task_1
      dockerfile: environment/Dockerfile.stage1
    image: harbor.innodata.local/protein-engineering/stage1:latest
    container_name: stage1-preparation
    networks:
      - pipeline-network
    volumes:
      - ./task_runs/task_1/source_pdb_structure_inputs:/workspace/input_structures:ro
      - pipeline-data:/data
    environment:
      - PDB_IDS=1IFS 1UQ4 2P8N
      - OUTPUT_DIR=/data/structures
      - LOG_LEVEL=INFO
    mem_limit: 2g
    memswap_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  stage2-rfdiffusion:
    build:
      context: ./task_runs/task_1
      dockerfile: environment/Dockerfile.stage2
    image: harbor.innodata.local/protein-engineering/stage2:latest
    container_name: stage2-rfdiffusion
    networks:
      - pipeline-network
    volumes:
      - pipeline-data:/data
    environment:
      - DATA_INPUT=/data/structures
      - DATA_OUTPUT=/data/scaffolds
      - FIXED_POSITIONS=80 123 177 180 209
      - NUM_DESIGNS=10
      - INFERENCE_STEPS=50
      - NOISE_LEVEL=1.0
      - LOG_LEVEL=INFO
    mem_limit: 16g
    memswap_limit: 16g
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    depends_on:
      - stage1-preparation

  stage3-proteinmpnn:
    build:
      context: ./task_runs/task_1
      dockerfile: environment/Dockerfile.stage3
    image: harbor.innodata.local/protein-engineering/stage3:latest
    container_name: stage3-proteinmpnn
    networks:
      - pipeline-network
    volumes:
      - pipeline-data:/data
    environment:
      - DATA_INPUT=/data/scaffolds
      - DATA_OUTPUT=/data/sequences
      - FIXED_POSITIONS=80 123 177 180 209
      - SAMPLING_TEMPERATURE=0.1
      - NUM_SEQUENCES=16
      - USE_SOLUBLE_MODEL=true
      - LOG_LEVEL=INFO
    mem_limit: 12g
    memswap_limit: 12g
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    depends_on:
      - stage2-rfdiffusion

  stage4-codon-optimization:
    build:
      context: ./task_runs/task_1
      dockerfile: environment/Dockerfile.stage4
    image: harbor.innodata.local/protein-engineering/stage4:latest
    container_name: stage4-codon-optimization
    networks:
      - pipeline-network
    volumes:
      - pipeline-data:/data
    environment:
      - DATA_INPUT=/data/sequences
      - DATA_OUTPUT=/data/dna_optimized
      - TARGET_SPECIES=e_coli
      - CODON_VARIANTS=5
      - AVOID_RESTRICTION_SITES=BsaI BsmBI
      - LOG_LEVEL=INFO
    mem_limit: 4g
    memswap_limit: 4g
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    depends_on:
      - stage3-proteinmpnn

  stage5-plasmid-generation:
    build:
      context: ./task_runs/task_1
      dockerfile: environment/Dockerfile.stage5
    image: harbor.innodata.local/protein-engineering/stage5:latest
    container_name: stage5-plasmid-generation
    networks:
      - pipeline-network
    volumes:
      - pipeline-data:/data
    environment:
      - DATA_INPUT=/data/dna_optimized
      - DATA_OUTPUT=/data/plasmids
      - BACKBONE_VARIANTS=3
      - MIN_LENGTH_BP=4500
      - INCLUDE_PROMOTER=T7
      - INCLUDE_RBS=true
      - INCLUDE_TERMINATOR=true
      - INCLUDE_RESISTANCE_MARKER=amp_r
      - LOG_LEVEL=INFO
    mem_limit: 8g
    memswap_limit: 8g
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    depends_on:
      - stage4-codon-optimization

  stage6-cloning:
    build:
      context: ./task_runs/task_1
      dockerfile: environment/Dockerfile.stage6
    image: harbor.innodata.local/protein-engineering/stage6:latest
    container_name: stage6-cloning
    networks:
      - pipeline-network
    volumes:
      - pipeline-data:/data
    environment:
      - DATA_INPUT_GENE=/data/dna_optimized
      - DATA_INPUT_BACKBONE=/data/plasmids
      - DATA_OUTPUT=/data/assembled_plasmids
      - ASSEMBLY_METHOD=Gibson
      - OVERLAP_LENGTH_BP=20
      - MIN_SUCCESS_RATE=0.8
      - LOG_LEVEL=INFO
    mem_limit: 4g
    memswap_limit: 4g
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    depends_on:
      - stage5-plasmid-generation

networks:
  pipeline-network:
    driver: bridge

volumes:
  pipeline-data:
    driver: local
